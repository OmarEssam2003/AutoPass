<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoPass — Admin Login</title>
  <link rel="stylesheet" href="css/dashboard.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); margin-left:0; }
    .login-wrap { width:100%; max-width:380px; padding:16px; }
    .login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px 32px; box-shadow:var(--shadow-md); }
    .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
    .login-logo-icon { width:36px; height:36px; background:var(--accent); border-radius:9px; display:flex; align-items:center; justify-content:center; }
    .login-logo-icon svg { color:#fff; }
    .login-logo-text { font-size:17px; font-weight:700; letter-spacing:-0.3px; }
    .login-logo-sub { font-size:11px; color:var(--text-muted); }
    .login-title { font-size:20px; font-weight:700; letter-spacing:-0.4px; margin-bottom:4px; }
    .login-sub { font-size:13px; color:var(--text-secondary); margin-bottom:24px; }
    .login-form { display:flex; flex-direction:column; gap:14px; }
    .login-btn { width:100%; height:40px; font-size:14px; font-weight:600; margin-top:4px; justify-content:center; }
    .login-error { background:var(--red-soft); color:var(--red); border:1px solid #fecaca; border-radius:var(--radius); padding:10px 12px; font-size:12.5px; display:none; }
    .login-error.show { display:block; }
    .login-footer { text-align:center; margin-top:16px; font-size:12px; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11a2 2 0 012 2v3"/>
            <rect x="9" y="11" width="14" height="10" rx="2"/>
            <circle cx="12" cy="16" r="1"/>
            <circle cx="20" cy="16" r="1"/>
          </svg>
        </div>
        <div>
          <div class="login-logo-text">AutoPass</div>
          <div class="login-logo-sub">Admin Dashboard</div>
        </div>
      </div>

      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Enter your admin credentials to continue</p>

      <div class="login-error" id="login-error"></div>

      <form class="login-form" id="login-form">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input class="form-input" type="email" id="email" placeholder="admin@autopass.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-primary login-btn" id="login-btn">
          Sign in
        </button>
      </form>
    </div>
    <div class="login-footer">AutoPass ANPR System &copy; 2026</div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    // Redirect if already logged in
    if (localStorage.getItem('ap_token')) {
      window.location.href = 'pages/overview.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-color:rgba(255,255,255,0.3);border-top-color:#fff"></span> Signing in…';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.message || 'Invalid credentials');

        // Reject non-admin logins
        if (data.account?.type !== 'admin') {
          throw new Error('Access denied. This dashboard is for admins only.');
        }

        localStorage.setItem('ap_token', data.token);
        localStorage.setItem('ap_admin', JSON.stringify(data.account));
        window.location.href = 'pages/overview.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Sign in';
      }
    });
  </script>
</body>
</html>
